# kipp behind nginx, a server block for the http context (for example
# /etc/nginx/conf.d/kipp.conf). Start kipp with
# --base-url https://ci.example.com, and with
# --client-ip-header X-Forwarded-For so that wrong passwords are also
# counted by client (nginx is on the same machine, in the default
# --trusted-proxy).

server {
    listen 80;
    listen [::]:80;
    server_name ci.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ci.example.com;

    ssl_certificate     /etc/letsencrypt/live/ci.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.example.com/privkey.pem;

    # HSTS is the proxy's to send: kipp speaks plain HTTP and cannot know
    # the browser came over HTTPS. Add "; preload" only once every name
    # under the domain is HTTPS for good.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A webhook's body is at most 25 MiB; kipp refuses more itself.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The Host as the browser sent it, port and all: kipp's login form
        # is refused as cross-origin when it does not match the page.
        proxy_set_header Host $http_host;
        # nginx appends the client's address; kipp takes the rightmost.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The log pages, the queue's events (/api/v1/queue/events) and the
        # long polls of kipp run --wait stream: nothing is held back
        # in a buffer, and a quiet stream is not cut after a minute.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
