post:
  operationId: reloadJobs
  tags: [admin]
  summary: Read the job files again
  description: For an admin.
  x-kipp-package: api
  security:
    - bearerToken: []
    - sessionCookie: []
      csrfToken: []
  responses:
    "200":
      description: The job files were read and taken.
      content:
        application/json:
          schema:
            $ref: ../schemas/Ok.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "422":
      $ref: ../responses/Unprocessable.yaml
    "500":
      $ref: ../responses/InternalError.yaml
