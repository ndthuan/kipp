post:
  operationId: runnerDone
  tags: [internal]
  summary: A runner says a stage has ended
  description: The body is a tar of the stage's junit and metrics files.
  x-kipp-package: runnerhub
  security:
    - runnerToken: []
  parameters:
    - $ref: ../parameters/AssignmentId.yaml
    - name: exit
      in: query
      required: true
      description: The stage's exit code.
      schema:
        type: integer
    - name: tries
      in: query
      description: How many times the runner ran the command; absent is once.
      schema:
        type: integer
        minimum: 1
    - name: error
      in: query
      description: Why the stage could not run, when it could not.
      schema:
        type: string
  requestBody:
    required: false
    content:
      application/x-tar:
        schema:
          type: string
          format: binary
  responses:
    "204":
      description: The stage is over.
    "400":
      $ref: ../responses/RunnerRefusal.yaml
    "401":
      $ref: ../responses/RunnerRefusal.yaml
    "410":
      $ref: ../responses/RunnerRefusal.yaml
