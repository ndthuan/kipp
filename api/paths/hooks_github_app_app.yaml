post:
  operationId: deliverGithubAppEvent
  tags: [webhooks]
  summary: A GitHub event for a GitHub App
  description: |
    The App's webhook: events of every repository the App is installed on,
    answered for the owner jobs that sign in as the App. The body is "a
    GitHub event" as GitHub sends it
    (https://docs.github.com/en/webhooks/webhook-events-and-payloads). A
    `ping` and an event kipp does not act on are answered 200 and ignored; an
    installation event asks for a scan (202).
  x-kipp-package: webhook
  security:
    - webhookSignature: []
  parameters:
    - name: app
      in: path
      required: true
      description: The App's name, as the owner job names it.
      schema:
        type: string
    - name: X-GitHub-Event
      in: header
      required: true
      description: The kind of event, for example `push`, `installation` or `ping`.
      schema:
        type: string
    - name: X-GitHub-Delivery
      in: header
      required: true
      description: The delivery's GUID. A delivery without one is refused.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: A GitHub event.
  responses:
    "200":
      description: A valid delivery that changes nothing, and why.
      content:
        application/json:
          schema:
            $ref: ../schemas/WebhookIgnored.yaml
    "202":
      description: The builds queued, or the scans asked for.
      content:
        application/json:
          schema:
            $ref: ../schemas/WebhookAccepted.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      description: The signature is missing or does not match. Nothing says which, or whether the App exists.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/Problem.yaml
    "408":
      description: The body was not all sent in time.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/Problem.yaml
    "409":
      $ref: ../responses/Conflict.yaml
    "413":
      $ref: ../responses/PayloadTooLarge.yaml
    "500":
      description: Something failed inside the server.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/Problem.yaml
    "503":
      $ref: ../responses/ServiceUnavailable.yaml
