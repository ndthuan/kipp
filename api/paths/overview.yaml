get:
  operationId: getOverview
  tags: [jobs]
  summary: What is failing, flaky, recently failed and coming up
  description: |
    The data of the front page, over the jobs the caller may view that
    build themselves: a multibranch job is represented by its children, an
    owner job by the children of its repos, and a job removed from the job
    files or disabled is in no section but the counts of `groups`. A build
    is green when it ended `success` or `unstable`, red when it ended
    `failed`, `timeout` or `lost`; other builds are not looked at. Each
    job is judged by its last 20 builds that ended green or red. The queue
    is `GET /queue` and is not repeated here.
  x-kipp-package: api
  responses:
    "200":
      description: The overview.
      content:
        application/json:
          schema:
            $ref: ../schemas/Overview.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "500":
      $ref: ../responses/InternalError.yaml
