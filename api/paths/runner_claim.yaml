get:
  operationId: runnerClaim
  tags: [internal]
  summary: A runner asks for a stage to run
  description: |
    A long-poll: it answers as soon as there is a stage for the runner, or a
    build ended, or when the server's wait is over with neither.
  x-kipp-package: runnerhub
  security:
    - runnerToken: []
  responses:
    "200":
      description: An assignment, or none, and the builds that ended since the last answer.
      content:
        application/json:
          schema:
            $ref: ../schemas/Claim.yaml
    "400":
      $ref: ../responses/RunnerRefusal.yaml
    "401":
      $ref: ../responses/RunnerRefusal.yaml
