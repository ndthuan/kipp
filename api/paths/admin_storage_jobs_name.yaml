delete:
  operationId: removeJobData
  tags: [admin]
  summary: Remove now the data of a job whose file is gone
  description: |
    Removes the ended builds of a removed job, or of a branch or pull
    request of a multibranch job that is gone, with their logs and
    artifacts, as the retention would 90 days after the newest. A build
    kept by hand stays. 409 for a job that has a job file, 404 when nothing
    of it is left. One row of the audit.
  x-kipp-package: api
  parameters:
    - $ref: ../parameters/JobName.yaml
  security:
    - bearerToken: []
    - sessionCookie: []
      csrfToken: []
  responses:
    "200":
      description: What was removed.
      content:
        application/json:
          schema:
            $ref: ../schemas/StorageJobRemoved.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "409":
      $ref: ../responses/Conflict.yaml
    "500":
      $ref: ../responses/InternalError.yaml
