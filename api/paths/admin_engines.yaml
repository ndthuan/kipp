get:
  operationId: listEngines
  tags: [admin]
  summary: The Docker engines
  description: For an admin; a token may read it.
  x-kipp-package: api
  responses:
    "200":
      description: The engines by name.
      content:
        application/json:
          schema:
            $ref: ../schemas/EngineList.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "500":
      $ref: ../responses/InternalError.yaml
