get:
  operationId: downloadStageArtifacts
  tags: [builds]
  summary: A stage's artifacts as one zip
  description: The zip is made as it is sent.
  x-kipp-package: api
  parameters:
    - $ref: ../parameters/BuildId.yaml
    - $ref: ../parameters/StageName.yaml
  responses:
    "200":
      description: The zip, as a file to save.
      headers:
        Content-Disposition:
          required: true
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    "401":
      $ref: ../responses/Unauthorized.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "500":
      $ref: ../responses/InternalError.yaml
