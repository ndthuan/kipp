get:
  operationId: listMetricHistory
  tags: [metrics]
  summary: The values builds reported to a store, newest first
  x-kipp-package: api
  parameters:
    - $ref: ../parameters/StoreName.yaml
    - name: metric
      in: query
      required: true
      schema:
        type: string
    - name: item
      in: query
      required: true
      schema:
        type: string
    - $ref: ../parameters/Limit.yaml
    - $ref: ../parameters/Cursor.yaml
  responses:
    "200":
      description: Up to `limit` rows, 100 by default.
      content:
        application/json:
          schema:
            $ref: ../schemas/MetricHistoryList.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "500":
      $ref: ../responses/InternalError.yaml
