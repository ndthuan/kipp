get:
  operationId: getMetricStore
  tags: [metrics]
  summary: One metric store
  description: The same object the list holds, for a store the caller may see.
  x-kipp-package: api
  parameters:
    - $ref: ../parameters/StoreName.yaml
  responses:
    "200":
      description: The store.
      content:
        application/json:
          schema:
            $ref: ../schemas/MetricStore.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "500":
      $ref: ../responses/InternalError.yaml
