get:
  operationId: getUser
  tags: [admin]
  summary: One user
  description: For an admin; a token may read it.
  x-kipp-package: api
  parameters:
    - name: name
      in: path
      required: true
      description: The user's name.
      schema:
        type: string
  responses:
    "200":
      description: The user.
      content:
        application/json:
          schema:
            $ref: ../schemas/User.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "500":
      $ref: ../responses/InternalError.yaml
