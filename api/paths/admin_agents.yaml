get:
  operationId: listAgents
  tags: [admin]
  summary: The standing agents
  description: For an admin; a token may read it.
  x-kipp-package: api
  responses:
    "200":
      description: The agents by name.
      content:
        application/json:
          schema:
            $ref: ../schemas/AgentList.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "500":
      $ref: ../responses/InternalError.yaml
