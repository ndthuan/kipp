        description:
          type: string
        disabled:
          type: boolean
        group:
          type: string
        last:
          $ref: "#/components/schemas/NullableBuild"
        name:
          type: string
        next:
          $ref: "#/components/schemas/NullableTimestamp"
        removed:
          description: True for a job that has builds but is no longer in the job files.
          type: boolean
        worst:
          description: The worst status among the children's last builds; null before any built.
          oneOf:
            - $ref: "#/components/schemas/BuildStatus"
            - type: "null"
      required:
