        concurrency:
          oneOf:
            - $ref: "#/components/schemas/Concurrency"
            - const: ""
        cron:
          type: string
        description:
          type: string
        disabled:
          type: boolean
        folder:
          description: The owner job a repo's job belongs to.
          type:
            - string
            - "null"
        group:
          type: string
        locks:
          items:
            type: string
          type: array
        multibranch:
          description: A multibranch job's repo.
          type:
            - string
            - "null"
        name:
          type: string
        next:
          $ref: "#/components/schemas/NullableTimestamp"
        owner:
          oneOf:
            - $ref: "#/components/schemas/Owner"
            - type: "null"
        params:
          items:
            $ref: "#/components/schemas/Param"
          type: array
        parent:
          description: The multibranch job a child belongs to.
          type:
            - string
            - "null"
        removed:
          type: boolean
        scan:
          oneOf:
            - $ref: "#/components/schemas/Scan"
