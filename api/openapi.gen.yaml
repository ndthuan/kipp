        - orphaned
        - metrics
      type: object
    MetricStoreList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/MetricStore"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    NextCursor:
      description: |
        Opaque. Sent back as `cursor`, it reads the page after this one of the same
        list; null when there is none. Only a cursor this server gave for the list
        is accepted, and it holds good while rows are added to the list.
      type:
        - string
        - "null"
    NullableBuild:
      oneOf:
        - $ref: "#/components/schemas/BuildSummary"
        - type: "null"
    NullableTimestamp:
      description: RFC 3339 in UTC, with exactly three fraction digits and a Z; null when the event has not happened.
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
      type:
        - string
        - "null"
