        - author
        - url
        - head_commit
        - base_branch
        - from_fork
        - state
        - gone_at
        - last_seen_at
        - last
      type: object
    ChildKind:
      enum:
        - branch
        - pr
        - pr-head
      type: string
    ChildList:
      additionalProperties: false
      description: |
        The rows of a list.
