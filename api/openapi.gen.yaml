                format: binary
                type: string
          description: The zip, as a file to save.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: A stage's artifacts as one zip
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/stages/{stage}/artifacts/{path}:
    get:
      description: |
        Always an attachment: never a type a browser renders, never sniffed, and
        sandboxed. A `Range` request is answered with 206.
      operationId: downloadArtifact
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/StageName"
        - description: The file's path inside the stage's directory, slashes included.
          in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The file.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
        "206":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The part of the file the `Range` asked for.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A condition the request made (`If-Match`, `If-Unmodified-Since`) does not hold.
        "416":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The `Range` is outside the file.
          headers:
            Content-Range:
              description: "`bytes */` and the size of the file."
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
      summary: One file a stage kept
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/stages/{stage}/log:
    get:
      description: |
        One of two forms; `Accept` does not change it (the stream is at
        `/log/events`). By default one chunk from `offset`, with the log's size
        in the `X-Kipp-*` headers (a HEAD request answers the headers alone).
        With `download=true` the whole log as a file, each line beginning with
        when it began (RFC 3339 in UTC) if `timestamps=true`. A stage the build
        does not have is 404.
      operationId: getStageLog
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/StageName"
        - description: Where to read from, in bytes. One that is not a whole number of 0 or more is refused.
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
        - description: Set to `true` for the whole log as a file. Only `true` and `false` are accepted.
          in: query
          name: download
          schema:
            type: boolean
        - description: Set to `true` for the time each line began in a download. Only `true` and `false` are accepted.
          in: query
          name: timestamps
          schema:
            type: boolean
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The log in the form asked for.
          headers:
            Content-Disposition:
              description: Download form. The log as a file to save.
              schema:
                type: string
            X-Kipp-More:
              description: Chunk form. `true` while there is more to read now or later, `false` once the log is complete and read to its end.
              schema:
                enum:
                  - "true"
                  - "false"
                type: string
            X-Kipp-Offset:
              description: Chunk form. The offset after the chunk, where the next one begins.
              schema:
                format: int64
                type: integer
            X-Kipp-Size:
              description: Chunk form. The log's size in bytes when it was read.
              schema:
                format: int64
                type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: A stage's console
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/stages/{stage}/log/events:
    get:
      description: |
        Every line as it is written until the build's logs are complete, as `id:`
        and `data:` events (the id is the file offset after the line) closed by
        `event: end`. With `timestamps=true` an `event: time` with the time the
        line began, RFC 3339 in UTC, comes before each line. A comment line
        (`: keep-alive`) is sent when nothing else has been for a while. A
        `Last-Event-ID` header, or `offset`, resumes a stream.
      operationId: streamStageLog
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/StageName"
        - description: Where to start, in bytes, when no `Last-Event-ID` is sent. One that is not a whole number of 0 or more is refused.
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
        - description: Set to `true` for the time each line began. Only `true` and `false` are accepted.
          in: query
          name: timestamps
          schema:
            type: boolean
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The stream.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: A stage's console as it is written
      tags:
        - builds
      x-kipp-package: api
  /cache/{scope}/entry/{id}:
    get:
      operationId: cacheGetEntry
      parameters:
        - $ref: "#/components/parameters/CacheScope"
        - description: The entry's id, from a lookup.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/zstd:
              schema:
                format: binary
                type: string
          description: The entry's archive.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - cacheToken: []
      summary: Download a cache entry
      tags:
        - internal
      x-kipp-package: cachesrv
  /cache/{scope}/lookup:
    get:
      description: |
        The entry saved under `key`, else the newest one whose key begins with
        one of the `restore` prefixes.
      operationId: cacheLookup
      parameters:
        - $ref: "#/components/parameters/CacheScope"
        - description: 1 to 512 letters, digits and `. _ + = -`.
          in: query
          name: key
          required: true
          schema:
            type: string
        - description: Key prefixes to fall back to, in order; given once for each.
          explode: true
          in: query
          name: restore
          schema:
            items:
              type: string
            type: array
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheFound"
          description: The entry that was found.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - cacheToken: []
      summary: Look for a cache entry
      tags:
        - internal
      x-kipp-package: cachesrv
  /cache/{scope}/{key}:
    put:
      description: A key that is already there keeps its entry and answers 200.
      operationId: cachePutEntry
      parameters:
        - $ref: "#/components/parameters/CacheScope"
        - description: 1 to 512 letters, digits and `. _ + = -`.
          in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/zstd:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          description: An entry with that key is there already; the body was not kept.
        "201":
          description: The entry was kept.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - cacheToken: []
      summary: Save a cache entry
      tags:
        - internal
      x-kipp-package: cachesrv
  /health:
    get:
      description: |
        Answers even when the store does not. The version and uptime are told to
        a caller who is signed in alone: a stranger would read in them what to
        try.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: The server answers.
      security:
        - {}
        - bearerToken: []
        - sessionCookie: []
      summary: Whether the server answers
      tags:
        - server
      x-kipp-package: api
  /hooks/github-app/{app}:
    post:
      description: |
        The App's webhook: events of every repository the App is installed on,
        answered for the owner jobs that sign in as the App. The body is "a
        GitHub event" as GitHub sends it
        (https://docs.github.com/en/webhooks/webhook-events-and-payloads). A
        `ping` and an event kipp does not act on are answered 200 and ignored; an
        installation event asks for a scan (202).
      operationId: deliverGithubAppEvent
      parameters:
        - description: The App's name, as the owner job names it.
          in: path
          name: app
          required: true
          schema:
            type: string
        - description: The kind of event, for example `push`, `installation` or `ping`.
          in: header
          name: X-GitHub-Event
          required: true
          schema:
            type: string
        - description: The delivery's GUID. A delivery without one is refused.
          in: header
          name: X-GitHub-Delivery
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              description: A GitHub event.
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIgnored"
          description: A valid delivery that changes nothing, and why.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAccepted"
          description: The builds queued, or the scans asked for.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The signature is missing or does not match. Nothing says which, or whether the App exists.
        "408":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body was not all sent in time.
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Something failed inside the server.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - webhookSignature: []
      summary: A GitHub event for a GitHub App
      tags:
        - webhooks
      x-kipp-package: webhook
  /hooks/github/{job}:
    post:
      description: |
        The body is "a GitHub event" as GitHub sends it
        (https://docs.github.com/en/webhooks/webhook-events-and-payloads); kipp
        reads the repository and the push or pull request in it. The delivery is
        checked with the job's secret and recorded by `X-GitHub-Delivery`, so a
        delivery sent twice is built once.
      operationId: deliverGithubJobEvent
      parameters:
        - description: The job the hook is registered for.
          in: path
          name: job
          required: true
          schema:
            type: string
        - description: The kind of event, for example `push`, `pull_request` or `ping`.
          in: header
          name: X-GitHub-Event
          required: true
          schema:
            type: string
        - description: The delivery's GUID. A delivery without one is refused.
          in: header
          name: X-GitHub-Delivery
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              description: A GitHub event.
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIgnored"
          description: A valid delivery that changes nothing, and why.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAccepted"
          description: The build, or the builds, queued.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The signature is missing or does not match. Nothing says which, or whether the job exists.
        "408":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body was not all sent in time.
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Something failed inside the server.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - webhookSignature: []
      summary: A GitHub event for a job
      tags:
        - webhooks
      x-kipp-package: webhook
