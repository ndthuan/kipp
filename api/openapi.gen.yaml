      properties:
        items:
          items:
            $ref: "#/components/schemas/MetricHistoryRow"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    MetricHistoryRow:
      additionalProperties: false
      description: One value a build reported, newest first in a list.
