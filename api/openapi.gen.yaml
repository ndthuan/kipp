        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The children of a multibranch job
      tags:
        - jobs
      x-kipp-package: api
  /jobs/{name}/scan:
    post:
      description: Needs the `build` permission on the job.
      operationId: scanJob
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
          description: The scan is under way, and this is how it stands.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Have a multibranch job's repo read now
      tags:
        - jobs
      x-kipp-package: api
  /metrics:
    get:
      operationId: listMetricStores
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricStoreList"
          description: Each store with the jobs that report into it and the metrics it remembers.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The metric stores the caller may see
      tags:
        - metrics
      x-kipp-package: api
  /metrics/{store}:
    get:
      description: The same object the list holds, for a store the caller may see.
      operationId: getMetricStore
      parameters:
        - $ref: "#/components/parameters/StoreName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricStore"
          description: The store.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: One metric store
      tags:
        - metrics
      x-kipp-package: api
  /metrics/{store}/compare:
    get:
      description: |
        Item by item, between what the build `from` reported into the store and
        what the build `to` did, or what the store remembers when `to` is
        `remembered`. The rows are sorted by the size of their change, largest
        first, then the items on one side only, each part by item. `metric` is
        needed.
      operationId: compareMetric
      parameters:
        - $ref: "#/components/parameters/StoreName"
        - in: query
          name: metric
          required: true
          schema:
            type: string
        - description: A build's id.
          in: query
          name: from
          schema:
            type: string
        - description: A build's id, or `remembered`.
          in: query
          name: to
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricComparisonList"
          description: Each item of the metric with its two values and the difference.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: One metric in two builds
      tags:
        - metrics
      x-kipp-package: api
  /metrics/{store}/history:
    get:
      operationId: listMetricHistory
      parameters:
        - $ref: "#/components/parameters/StoreName"
        - in: query
          name: metric
          required: true
          schema:
            type: string
        - in: query
          name: item
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricHistoryList"
          description: Up to `limit` rows, 100 by default.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The values builds reported to a store, newest first
      tags:
        - metrics
      x-kipp-package: api
  /metrics/{store}/remembered:
    get:
      operationId: listRememberedValues
      parameters:
        - $ref: "#/components/parameters/StoreName"
        - description: Only this metric's values.
          in: query
          name: metric
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RememberedValueList"
          description: The remembered value of each item, with the build that set it.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: What a store remembers
      tags:
        - metrics
      x-kipp-package: api
  /openapi.yaml:
    get:
      description: |
        The OpenAPI 3.1 description of `/api/v1`, `api/openapi.gen.yaml` as it was
        built into this binary, so it is the description of the code that answers.
        No login or token is needed. The `ETag` is a hash of the file, and a
        request with a matching `If-None-Match` is answered 304 without the body.
      operationId: getOpenapi
      parameters:
        - description: The `ETag` of a copy the caller already has.
          in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: The description, in YAML.
          headers:
            ETag:
              description: A hash of the file, in quotes.
              schema:
                type: string
        "304":
          description: The caller's copy is the current one.
          headers:
            ETag:
              description: A hash of the file, in quotes.
              schema:
                type: string
      security:
        - {}
      summary: This description of the API
      tags:
        - server
      x-kipp-package: api
  /queue:
    get:
      description: Only the builds of jobs the caller may see.
      operationId: getQueue
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
          description: The queue.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: What runs and what waits
      tags:
        - queue
      x-kipp-package: api
  /queue/events:
    get:
      description: |
        A server-sent event stream. An event called `changed`, with no data, is
        sent each time what the caller may see of the queue changes, and the
        client reads the queue again; a comment line `: still here` keeps a quiet
        stream open. A change the caller may not see is not told.
      operationId: streamQueueEvents
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The stream, until the client leaves or its login ends.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Told when the queue changes
      tags:
        - queue
      x-kipp-package: api
components:
  parameters:
    AssignmentId:
      description: The assignment's id, from the claim that gave the stage.
      in: path
      name: id
      required: true
      schema:
        type: string
    BuildId:
      description: The build's id, as `id` in a build (not its number within the job).
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
    CacheScope:
      description: The cache scope; the token must name it.
      in: path
      name: scope
      required: true
      schema:
        type: string
    Cursor:
      description: |
        Where the page begins: the `next_cursor` of the page before it. Opaque. One
        that this server did not give for this list is refused.
      in: query
      name: cursor
      schema:
        type: string
    JobName:
      description: The job's name.
      in: path
      name: name
      required: true
      schema:
        type: string
    Limit:
      description: |
        How many rows to return; the default is the list's own, the most 500 (a
        larger number is read as 500). A value that is not a whole number of 1 or
        more is refused.
      in: query
      name: limit
      schema:
        minimum: 1
        type: integer
    StageName:
      description: A stage's name.
      in: path
      name: stage
      required: true
      schema:
        type: string
    StoreName:
      description: A metric store's name.
      in: path
      name: store
      required: true
      schema:
        type: string
  responses:
    AgentRefusal:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
      description: |
        The agent protocol's own refusal: why, and for a 409 the version the
        server is. A 401 is an agent token that is missing or that nobody holds;
        a 410 a stage that is not running on this agent.
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The request is not one the server can read, for example a parameter or a body that does not parse.
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The request conflicts with the state of the server, for example a delivery received before or a job that drops builds while one runs.
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: |
        The caller may not do this: not an admin, a job without the permission,
        a session request without its CSRF header, or a password to be asked
        again.
    InternalError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Something failed inside the server; the reason is in its log, not in the answer.
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: |
        No such thing, or a job the caller may not see: the answer is the same
        for both.
    PayloadTooLarge:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The request body is over the limit, 64 KiB for the JSON API and the webhook's own cap for a delivery.
    ServiceUnavailable:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The server is quiet (it takes no new builds), or busy.
      headers:
        Retry-After:
          description: Whole seconds to wait before sending the request again.
          schema:
            type: integer
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Too many streams or waits are open for this caller, or too many wrong passwords.
      headers:
        Retry-After:
          description: Whole seconds to wait before sending the request again, when the refusal is about a password.
          schema:
            type: integer
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: A login or a token is required, or the one sent is not valid.
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The job files were refused; the message says why.
  schemas:
    Activity:
      additionalProperties: false
      description: One line of a job's activity, for example a reload or a scan.
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        line:
          type: string
      required:
        - at
        - line
      type: object
    ActivityList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/Activity"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    Agent:
      additionalProperties: false
      description: A standing agent, its record and, once it has connected, what the server sees of it now. Never its token.
      properties:
        arch:
          type: string
        busy:
          description: How many stages it runs or has been given now.
          type: integer
        enabled:
          type: boolean
        executors:
          description: 0 for as many at once as it is given.
          type: integer
        labels:
          items:
            type: string
          type: array
        last_seen_at:
          $ref: "#/components/schemas/NullableTimestamp"
        name:
          type: string
        online:
          type: boolean
        os:
          type: string
        since:
          $ref: "#/components/schemas/NullableTimestamp"
        stages:
          description: What it runs or has been given.
          items:
            $ref: "#/components/schemas/AgentStage"
          type: array
        version:
          type: string
      required:
        - name
        - labels
        - executors
        - busy
        - enabled
        - online
        - since
        - version
        - os
        - arch
        - stages
        - last_seen_at
      type: object
    AgentArtifacts:
      additionalProperties: false
      description: A stage's artifacts key.
      properties:
        Max:
          description: The most the matches may come to, in bytes.
          format: int64
          type: integer
        Paths:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - Paths
        - Max
      type: object
    AgentCache:
      additionalProperties: false
      description: One declared cache of a stage, its keys already expanded.
      properties:
        Key:
          type: string
        Paths:
          items:
            type: string
          type:
            - array
            - "null"
        RestoreKeys:
          items:
            type: string
          type: array
        Scope:
          type: string
      required:
        - Key
        - Paths
        - Scope
      type: object
    AgentEnded:
      additionalProperties: false
      description: A build whose stages on the agent are over; its workspace there goes.
      properties:
        Workspace:
          type: string
      required:
        - Workspace
      type: object
    AgentInput:
      additionalProperties: false
      description: One stage whose artifacts a stage is given.
      properties:
        Size:
          format: int64
          type: integer
        Stage:
          type: string
      required:
        - Stage
        - Size
      type: object
    AgentList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/Agent"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    AgentStage:
      additionalProperties: false
      description: A stage an agent runs or has been given.
      properties:
        build:
          $ref: "#/components/schemas/BuildRef"
        stage:
          type: string
      required:
        - build
        - stage
      type: object
    Artifact:
      additionalProperties: false
      description: One file a stage kept.
      properties:
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
        url:
          description: Where to download it.
          type: string
      required:
        - path
        - size
        - sha256
        - url
      type: object
    Assignment:
      additionalProperties: false
      description: One stage to run.
      properties:
        Artifacts:
          $ref: "#/components/schemas/AgentArtifacts"
        Baseline:
          contentEncoding: base64
          description: What the stage's store remembers; absent for a stage that declares no metrics.
          type: string
        Cache:
          items:
            $ref: "#/components/schemas/AgentCache"
          type: array
        Command:
          description: Run with the agent's shell, `-c`.
          type: string
        Env:
          description: The variables the server gives the stage, as `NAME=value`.
          items:
            type: string
          type:
            - array
            - "null"
        ID:
          type: string
        Inputs:
          items:
            $ref: "#/components/schemas/AgentInput"
          type: array
        Job:
          type: string
        Junit:
          description: The stage's junit glob; empty is none.
          type: string
        Metrics:
          description: The stage's metrics file glob.
          type: string
        Number:
          type: integer
        Retries:
          description: How many more times the agent runs the command when it ends with a code that is neither 0 nor in UnstableExit; absent is none.
          maximum: 10
          minimum: 0
          type: integer
        Stage:
          type: string
        UnstableExit:
          description: The exit codes that count as ending well besides 0, and that are not run again.
          items:
            type: integer
          type: array
        Workdir:
          description: A path inside the workspace the stage runs in.
          type: string
        Workspace:
          description: The build's directory under the agent's workdir; empty is the workdir itself.
          type: string
      required:
        - ID
        - Job
        - Number
        - Stage
        - Command
        - Env
        - Workspace
        - Workdir
        - Junit
      type: object
    AuditList:
      additionalProperties: false
      description: |
        The rows newest first.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditRow"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    AuditRow:
      additionalProperties: false
      description: One row of the audit.
      properties:
        action:
          type: string
        actor:
          type: string
        at:
          $ref: "#/components/schemas/Timestamp"
        detail:
          type: string
        id:
          format: int64
          type: integer
        target:
          type: string
      required:
        - id
        - at
        - actor
        - action
        - target
        - detail
      type: object
    Build:
      additionalProperties: false
      description: |
        One build with its stages. Only a build of a multibranch job's child has a
        value in `parent` to `base_commit`, but `built_commit`, which a build of a
        `source` job has too: the commit its clone checked out. Any other has
        null.
      properties:
        base_branch:
          type:
            - string
            - "null"
        base_commit:
          type:
            - string
            - "null"
        branch:
          type:
            - string
            - "null"
        built_commit:
          type:
            - string
            - "null"
        complete:
          description: True when the build has ended and nothing more will be written for it, no stage, test or line of a log.
          type: boolean
        finished_at:
          $ref: "#/components/schemas/NullableTimestamp"
        id:
          format: int64
          type: integer
        job:
          type: string
        kept:
          description: Who kept the build out of retention and when, null for a build under its job's rules.
          oneOf:
            - $ref: "#/components/schemas/Kept"
            - type: "null"
        number:
          description: The build's number within its job.
          type: integer
        params:
          additionalProperties:
            type: string
          type:
            - object
            - "null"
        parent:
          description: The multibranch job this build's job is a child of.
          type:
            - string
            - "null"
        pr:
          type:
            - integer
            - "null"
        queued_at:
          $ref: "#/components/schemas/Timestamp"
        stages:
          items:
            $ref: "#/components/schemas/Stage"
          type: array
        started_at:
          $ref: "#/components/schemas/NullableTimestamp"
        started_by:
          type: string
        status:
          $ref: "#/components/schemas/BuildStatus"
        trigger:
          description: What started it, `cron`, `api`, `web`, `webhook` or `after`.
          type: string
        trigger_detail:
          type: string
      required:
        - id
        - job
        - number
        - status
        - trigger
        - trigger_detail
        - params
        - started_by
        - queued_at
        - started_at
        - finished_at
        - parent
        - branch
        - built_commit
        - pr
        - base_branch
        - base_commit
        - kept
        - stages
        - complete
      type: object
    BuildList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/BuildSummary"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    BuildMetrics:
      additionalProperties: false
      description: What the stages of a build reported and what the guards made of it.
      properties:
        build:
          $ref: "#/components/schemas/BuildRef"
        stages:
          items:
            $ref: "#/components/schemas/StageMetrics"
          type: array
        store:
          type: string
      required:
        - build
        - store
        - stages
      type: object
    BuildRef:
      additionalProperties: false
      description: |
        A build, wherever another answer refers to one. `status` is null once
        retention has removed the build; `id` is then whatever the answer kept of
        it, and 0 for a guard's origin, which keeps only the job and the number.
      properties:
        id:
          format: int64
          type: integer
        job:
          type: string
        number:
          type: integer
        status:
          oneOf:
            - $ref: "#/components/schemas/BuildStatus"
            - type: "null"
      required:
        - id
        - job
        - number
        - status
      type: object
    BuildStatus:
      enum:
        - queued
        - running
        - success
        - unstable
        - failed
        - cancelled
        - lost
        - timeout
      type: string
    BuildSummary:
      additionalProperties: false
      description: |
        One build of a job, as a list, a job's `last` and the answer to a trigger
        show it. Only a build of a multibranch job's child has a value in the last
        six fields, but `built_commit`, which a build of a `source` job has too:
        the commit its clone checked out. Any other has null.
      properties:
        base_branch:
          type:
            - string
            - "null"
        base_commit:
          type:
            - string
            - "null"
        branch:
          type:
            - string
            - "null"
        built_commit:
          type:
            - string
            - "null"
        finished_at:
          $ref: "#/components/schemas/NullableTimestamp"
        id:
          format: int64
          type: integer
        job:
          type: string
        kept:
          description: Who kept the build out of retention and when, null for a build under its job's rules.
          oneOf:
            - $ref: "#/components/schemas/Kept"
            - type: "null"
        number:
          description: The build's number within its job.
          type: integer
        params:
          additionalProperties:
            type: string
          type:
            - object
            - "null"
        parent:
          description: The multibranch job this build's job is a child of.
          type:
            - string
            - "null"
        pr:
          type:
            - integer
            - "null"
        queued_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/NullableTimestamp"
        started_by:
          type: string
        status:
          $ref: "#/components/schemas/BuildStatus"
        trigger:
          description: What started it, `cron`, `api`, `web`, `webhook` or `after`.
          type: string
        trigger_detail:
          type: string
      required:
        - id
        - job
        - number
        - status
        - trigger
        - trigger_detail
        - params
        - started_by
        - queued_at
        - started_at
        - finished_at
        - parent
        - branch
        - built_commit
        - pr
        - base_branch
        - base_commit
        - kept
      type: object
    CacheEntry:
      additionalProperties: false
      description: One entry of the keyed build cache.
      properties:
        id:
          format: int64
          type: integer
        key:
          type: string
        last_restored_at:
          $ref: "#/components/schemas/NullableTimestamp"
        namespace:
          type: string
        saved_at:
          $ref: "#/components/schemas/NullableTimestamp"
        saved_by:
          description: The build that saved it; null once retention has removed the build.
          oneOf:
