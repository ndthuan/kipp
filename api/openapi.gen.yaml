      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/stages/{stage}/artifacts.zip:
    get:
      description: The zip is made as it is sent.
      operationId: downloadStageArtifacts
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/StageName"
      responses:
        "200":
          content:
            application/octet-stream:
