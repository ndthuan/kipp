        detail:
          description: Why, for a person.
          type: string
        status:
          description: The HTTP status, as in the response line.
          type: integer
        title:
          description: The code's fixed one-line summary.
          type: string
        type:
          description: A link to the code's entry in `api/problems.md`.
          examples:
            - https://github.com/ndthuan/kipp/blob/main/api/problems.md#not_found
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
