            - string
            - "null"
        running:
          type: boolean
        token:
          type: boolean
      required:
        - token
        - every_seconds
        - running
        - at
        - result
        - error
      type: object
    Secret:
      additionalProperties: false
      description: A secret by name, never its value.
      properties:
        jobs:
          description: The loaded jobs that ask for it, sorted.
          items:
            type: string
          type: array
        kind:
          description: What the secret holds, a one-line value, a file's bytes or a user with a password; empty for a name no secret holds.
          enum:
            - ""
            - text
            - file
            - userpass
          type: string
        name:
          type: string
        narrow:
          description: True when the secret is global and exactly one job lists it, so that it could be scoped to that job.
          type: boolean
        scopes:
          description: Which jobs may list the secret, `global`, `group:<name>` or `job:<pattern>`; empty for a name no secret holds.
          items:
            type: string
          type: array
        updated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        user:
          description: A userpass secret's user, never its password; empty for any other.
          type: string
        webhook:
          description: True when it is a name a job's webhook trigger checks its deliveries with.
          type: boolean
      required:
        - name
        - kind
        - user
        - scopes
        - narrow
        - updated_at
        - jobs
        - webhook
      type: object
    Secrets:
      additionalProperties: false
      properties:
        missing:
          description: Every name a loaded job asks for that none holds.
          items:
            $ref: "#/components/schemas/Secret"
          type: array
        out_of_scope:
          description: Every secret that is set but whose scopes do not reach a loaded job that lists it, with those jobs in `jobs`. A build of such a job fails before it starts.
          items:
            $ref: "#/components/schemas/Secret"
          type: array
        set:
          description: Every secret that is set.
          items:
            $ref: "#/components/schemas/Secret"
          type: array
      required:
        - set
        - missing
        - out_of_scope
      type: object
    Server:
      additionalProperties: false
      description: What the server runs with.
      properties:
        agent_env:
          description: The variables of the server's environment that agents' stages are given.
          items:
            type: string
          type: array
        agent_listen:
          description: The listener of the agent protocol and the cache apart from `listen`.
          type: string
        agent_url:
          description: The URL a container's agent dials.
          type: string
        base_url:
          type: string
        builds:
          description: The builds with something running at once.
          type: integer
        checked_at:
          $ref: "#/components/schemas/NullableTimestamp"
        data_dir:
          type: string
        db_size_bytes:
          description: The database file's size; null when it could not be read.
          type:
            - integer
            - "null"
        default_runs_on:
          description: The labels of a stage that names none, on a server with no executors.
          items:
            type: string
          type: array
        executors:
          description: The server's own stages at once; 0 for none.
          type: integer
        free_disk_bytes:
          description: Bytes free on the data directory's disk; null when they could not be read.
          type:
            - integer
            - "null"
        go_version:
          type: string
        jobs:
          description: How many jobs are loaded.
          type: integer
        jobs_dir:
          type: string
        last_reload_at:
          $ref: "#/components/schemas/Timestamp"
        last_reload_error:
          description: Why the last read of the job files was refused; empty when it was taken.
          type: string
        latest:
          description: The latest release's version when it is newer than `version`; empty when it is not, or when none is known.
          type: string
        listen:
          type: string
        notes_url:
          description: The page of the release in `latest`; empty when `latest` is.
          type: string
        origin:
          description: Where the running binary came from, such as Homebrew, Docker image, or release archive or build; `data directory (the executable's own is vA.B.C)` when the server runs a newer binary kept in the data directory.
          type: string
        schema:
          description: The database's schema version.
          type: integer
        session_ttl_seconds:
          type: integer
        shell:
          type: string
        started_at:
          $ref: "#/components/schemas/Timestamp"
        timezone:
          type: string
        update_check:
          description: Whether the server looks for newer releases; false with `--no-update-check`.
          type: boolean
        upgradable:
          description: Whether the release in `latest` carries the signed checksums an upgrade needs.
          type: boolean
        version:
          type: string
      required:
        - version
        - go_version
        - schema
        - started_at
        - listen
        - base_url
        - executors
        - builds
        - default_runs_on
        - agent_env
        - agent_url
        - agent_listen
        - shell
        - session_ttl_seconds
        - timezone
        - data_dir
        - jobs_dir
        - free_disk_bytes
        - db_size_bytes
        - last_reload_at
        - last_reload_error
        - jobs
        - origin
        - update_check
        - latest
        - notes_url
        - upgradable
        - checked_at
      type: object
    Stage:
      additionalProperties: false
      description: One stage of a build.
      properties:
        exit_code:
          type:
            - integer
            - "null"
        finished_at:
          $ref: "#/components/schemas/NullableTimestamp"
        name:
          type: string
        needs:
          description: The stages that must end well before this one starts.
          items:
            type: string
          type: array
        ran_on:
          description: Where it ran, `local`, an agent's name, or `engine/n` for a container; empty before it starts.
          type: string
        started_at:
          $ref: "#/components/schemas/NullableTimestamp"
        status:
          $ref: "#/components/schemas/StageStatus"
        tries:
          description: How many times its command ran, which `retries` makes more than one; 1 for a stage that ran once or has not run.
          minimum: 1
          type: integer
      required:
        - name
        - needs
        - status
        - exit_code
        - started_at
        - finished_at
        - ran_on
        - tries
      type: object
    StageArtifacts:
      additionalProperties: false
      description: What one stage of a build kept.
      properties:
        files:
          items:
            $ref: "#/components/schemas/Artifact"
          type: array
        stage:
          type: string
        zip:
          description: Where to download all of them as one zip.
          type: string
      required:
        - stage
        - zip
        - files
      type: object
    StageArtifactsList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/StageArtifacts"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    StageMetrics:
      additionalProperties: false
      properties:
        guards:
          items:
            $ref: "#/components/schemas/Guard"
          type: array
        metrics:
          items:
            $ref: "#/components/schemas/ReportedMetric"
          type: array
        name:
          type: string
      required:
        - name
        - metrics
        - guards
      type: object
    StageStatus:
      enum:
        - pending
        - running
        - success
        - unstable
        - failed
        - skipped
        - cancelled
      type: string
    TestResult:
      additionalProperties: false
      description: One JUnit case of a build.
      properties:
        duration_ms:
          type: integer
        message:
          type: string
        name:
          type: string
        stage:
          type: string
        status:
          enum:
            - passed
            - failed
            - skipped
          type: string
        suite:
          type: string
      required:
        - stage
        - suite
        - name
        - status
        - duration_ms
        - message
      type: object
    TestResultList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/TestResult"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    Timestamp:
      description: RFC 3339 in UTC, with exactly three fraction digits and a Z, as `2026-10-30T12:00:00.123Z`.
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
      type: string
    Token:
      additionalProperties: false
      description: What is known of an API token, never the token or its hash.
      properties:
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        id:
          format: int64
          type: integer
        label:
          type: string
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required:
        - id
        - label
        - created_at
        - last_used_at
        - expires_at
      type: object
    TriggerRequest:
      additionalProperties: false
      description: The body of a trigger. No body at all is no params; anything else in it is refused.
      properties:
        params:
          additionalProperties:
            type: string
          type: object
      type: object
    Upgrade:
      additionalProperties: false
      description: |
        The server's upgrade, or its return to the version before: the step it is at,
        the last failure, and what can be done now. The progress survives the
        server's restart, so it is read from a server that has just come back.
      properties:
        backup:
          description: The backup taken for it, once there is one.
          type: string
        error:
          description: Why the last run of this process ended without switching; empty otherwise.
          type: string
        from:
          description: The version the server was running when it began; empty when idle.
          type: string
        last_failure:
          anyOf:
            - $ref: "#/components/schemas/UpgradeFailure"
            - type: "null"
          description: Why the launcher last went back to an earlier version; null when it did not.
        latest:
          description: The newer release the update check knows; empty when there is none.
          type: string
        queued:
          description: Builds waiting to start, while the upgrade waits for them.
          type: integer
        rollback_to:
          description: |
            The version a rollback returns to (`bundled` is the executable the
            server was installed as); empty when there is none to return to.
          type: string
        running:
          description: Builds with something running, while the upgrade waits for them.
          type: integer
        state:
          description: |
            `idle` before any upgrade, then `preflight`, `downloading`, `verifying`,
            `waiting` (quiet, for the builds to end), `backup`, `switching` (the
            server stops and the launcher starts the new version), and the ends:
            `done`, `failed` and `cancelled`.
          enum:
            - idle
            - preflight
            - downloading
            - verifying
            - waiting
            - backup
            - switching
            - done
            - failed
            - cancelled
          type: string
        unavailable:
          description: Why an upgrade cannot start now; empty when it can.
          type: string
        updated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        upgradable:
          description: True when that release can be upgraded to.
          type: boolean
        version:
          description: The version being upgraded to, or returned to; empty when idle.
          type: string
      required:
        - state
        - version
        - from
        - backup
        - running
        - queued
        - updated_at
        - error
        - latest
        - upgradable
        - unavailable
        - rollback_to
        - last_failure
      type: object
    UpgradeFailure:
      additionalProperties: false
      description: Why the launcher went back to the version before, as it recorded it.
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        from:
          type: string
        log_tail:
          description: The end of what the version that failed printed.
          type: string
        reason:
          type: string
        version:
          type: string
      required:
        - version
        - from
        - reason
        - log_tail
        - at
      type: object
    UpgradeRequest:
      additionalProperties: false
      description: |
        The body of an upgrade or a rollback. No body at all is a safe restart with
        the default wait.
      properties:
        confirm_lost:
          default: false
          description: Says the running builds may end as lost, when `safe_restart` is false.
          type: boolean
        safe_restart:
          default: true
          description: |
            Wait, in quiet mode, until no build runs or waits, and restart then.
            Without it the builds that run end as `lost`, and `confirm_lost` is needed.
          type: boolean
        version:
          description: The release to upgrade to; it must be the latest one. Not for a rollback.
          type: string
        wait_timeout:
          description: A Go duration, such as `90m`. How long to wait for the builds, 2 hours when absent.
          type: string
      type: object
    User:
      additionalProperties: false
      description: What an admin sees of a user, never a password or a token.
      properties:
        admin:
          type: boolean
        gone_grants:
          description: The jobs among `grants` that are no longer loaded, sorted.
          items:
            type: string
          type: array
        grants:
          additionalProperties:
            items:
              type: string
            type: array
          description: The permissions on each job, including jobs no longer loaded.
          type: object
        last_login_at:
          $ref: "#/components/schemas/NullableTimestamp"
        name:
          type: string
        sessions:
          description: How many live browser sessions the user has.
          type: integer
        tokens:
          items:
            $ref: "#/components/schemas/Token"
          type: array
      required:
        - name
        - admin
        - last_login_at
        - grants
        - gone_grants
        - tokens
        - sessions
      type: object
    UserList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/User"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    WaitReason:
      description: |
        Why a queued build has not started: its job is gone or disabled, a build
        of the same job is ahead of it, another build holds a lock, every
        executor is taken, or nothing holds it back and the next pass starts it.
        Anyone but an admin is told only that it waits to start (start), since
        what holds it back may be a job they may not view.
      enum:
        - gone
        - job
        - lock
        - executor
        - nothing
        - start
      type: string
    WebhookAccepted:
      oneOf:
        - additionalProperties: false
          description: A job's delivery queued its build.
          properties:
            id:
              format: int64
              type: integer
            number:
              type: integer
          required:
            - id
            - number
          type: object
        - additionalProperties: false
          description: A multibranch or owner job's delivery, with what became of each child build.
          properties:
            builds:
              items:
                $ref: "#/components/schemas/WebhookBuild"
              type: array
          required:
            - builds
          type: object
        - additionalProperties: false
          description: A GitHub App installation event asked for scans of these owner jobs.
          properties:
            scan:
              items:
                type: string
              type: array
          required:
            - scan
          type: object
    WebhookBuild:
      additionalProperties: false
      description: What became of the build one child job was to get.
      properties:
        error:
          description: Why no build was queued.
          type: string
        id:
          format: int64
          type: integer
        job:
          type: string
        number:
          type: integer
        skipped:
          description: Present when the commit has a build queued or running already.
          type: string
      required:
        - job
      type: object
    WebhookIgnored:
      additionalProperties: false
      description: The delivery was valid and changes nothing; `ignored` says why.
      properties:
        ignored:
          type: string
      required:
        - ignored
      type: object
  securitySchemes:
    agentToken:
      description: An agent's token (`kippa_` followed by the secret).
      scheme: bearer
      type: http
    bearerToken:
      description: A user's API token, made on the account page.
      scheme: bearer
      type: http
    cacheToken:
      description: The token a build's stage is given to reach its caches, valid while the build runs.
      scheme: bearer
      type: http
    csrfToken:
      description: The session's CSRF token, sent beside the session cookie on every request that changes something.
      in: header
      name: X-CSRF-Token
      type: apiKey
    sessionCookie:
      description: |
        The browser session. A request that is not GET or HEAD must also
        carry the session's `X-CSRF-Token`, or it is 403.
      in: cookie
      name: __Host-kipp_session
      type: apiKey
    webhookSignature:
      description: |
        `sha256=` and the hex HMAC-SHA256 of the request body, keyed with the
        secret of the job (or App) the delivery is for.
      in: header
      name: X-Hub-Signature-256
      type: apiKey
