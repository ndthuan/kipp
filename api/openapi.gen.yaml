openapi: 3.1.0
info:
  description: |
    Everything a machine calls on a kipp server lives under `/api/v1`: the
    JSON API (jobs, builds, logs, artifacts, metrics, the queue and the
    admin reads), the webhook endpoints GitHub delivers to, and the two
    protocols between kipp and an agent of the same version (the agent
    protocol and the build cache), which are tagged `internal`.

    This file is generated: the sources are `api/openapi.yaml` and the files
    beside it, and `make openapi` writes `api/openapi.gen.yaml`. The gate
    fails when the two differ, when a route is not described here, when a
    handler answers something this file does not allow, and when an
    operation is described that no test reaches.
  license:
    name: See the LICENSE file of the kipp repository
    url: https://github.com/ndthuan/kipp/blob/main/LICENSE
  summary: The HTTP API of a kipp server, version 1.
  title: kipp API
  version: 1.0.0
servers:
  - description: This server.
    url: /api/v1
security:
  - bearerToken: []
  - sessionCookie: []
tags:
  - description: Whether the server answers, and what it runs with.
    name: server
  - description: Jobs, their builds, activity and children.
    name: jobs
  - description: One build, its stages, logs, results and artifacts.
    name: builds
  - description: The metric stores jobs report into.
    name: metrics
  - description: What runs and what waits.
    name: queue
  - description: Reads of users, secrets, engines, agents, the cache and the audit, the server's quiet mode and its upgrade; for an admin.
    name: admin
  - description: Deliveries from GitHub.
    name: webhooks
  - description: Between kipp and an agent of the same version. No stability promise.
    name: internal
paths:
  /admin/agents:
    get:
      description: For an admin; a token may read it.
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
          description: The agents by name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The standing agents
      tags:
        - admin
      x-kipp-package: api
  /admin/audit:
    get:
      description: For an admin; a token may read it.
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
          description: Up to `limit` rows, 100 by default.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: A page of the audit, newest first
      tags:
        - admin
      x-kipp-package: api
  /admin/cache:
    get:
      description: For an admin; a token may read it.
      operationId: listCacheEntries
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheEntryList"
          description: |
            Up to `limit` entries, 100 by default, the least recently restored
            first. An entry restored while the pages are read moves to the end, so
            it can be read twice, and no entry is missed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The entries of the build cache
      tags:
        - admin
      x-kipp-package: api
  /admin/engines:
    get:
      description: For an admin; a token may read it.
      operationId: listEngines
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineList"
          description: The engines by name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The Docker engines
      tags:
        - admin
      x-kipp-package: api
  /admin/quiet:
    delete:
      operationId: clearQuiet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiet"
          description: The quiet mode, now off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: End the server's quiet mode
      tags:
        - admin
      x-kipp-package: api
    get:
      description: |
        In quiet mode the server takes no new builds (triggers answer 503) and
        lets the ones that run finish, so that it can be restarted. For an
        admin.
      operationId: getQuiet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiet"
          description: The quiet mode and what still runs or waits.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Whether the server is quiet
      tags:
        - admin
      x-kipp-package: api
    post:
      operationId: setQuiet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiet"
          description: The quiet mode, now on.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Make the server quiet
      tags:
        - admin
      x-kipp-package: api
  /admin/reload:
    post:
      description: For an admin.
      operationId: reloadJobs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: The job files were read and taken.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Read the job files again
      tags:
        - admin
      x-kipp-package: api
  /admin/secrets:
    get:
      description: For an admin; a token may read it.
      operationId: listSecrets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secrets"
          description: Every secret that is set, and every name a loaded job asks for that none holds.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Which secrets are set and which are missing, never a value
      tags:
        - admin
      x-kipp-package: api
  /admin/server:
    get:
      description: For an admin; a token may read it.
      operationId: getServer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
          description: The server's build, flags and the state of its data directory.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: What the server runs with
      tags:
        - admin
        - server
      x-kipp-package: api
  /admin/upgrade:
    delete:
      description: |
        Possible until the backup begins: it turns quiet mode off, removes what was
        downloaded and leaves the server as it was. After that only a rollback
        exists.
      operationId: cancelUpgrade
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
          description: The upgrade, now cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Cancel the upgrade
      tags:
        - admin
      x-kipp-package: api
    get:
      description: |
        Where an upgrade or a rollback is, the last failure, and whether an upgrade
        or a rollback can start now. For an admin.
      operationId: getUpgrade
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
          description: The upgrade.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: The server's upgrade
      tags:
        - admin
      x-kipp-package: api
    post:
      description: |
        Checks free space, downloads the release and checks its signature and
        checksum, waits in quiet mode for the builds to end, backs up the data,
        and restarts into the new version; the launcher puts everything back if
        the new version does not come up. The answer is the first status; poll
        `GET` for the rest, the server being away while it restarts. One upgrade
        runs at a time. Not available in a development build, or where the data
        directory cannot be written, and then the answer names the lines to upgrade
        by hand.
      operationId: startUpgrade
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
          description: The upgrade has begun.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Upgrade the server to the latest release
      tags:
        - admin
      x-kipp-package: api
  /admin/upgrade/rollback:
    post:
      description: |
        Waits in quiet mode like an upgrade, then restarts with the backup of the
        last upgrade put back, so that everything written since the upgrade is
        lost. Available while that backup exists. The answer is the first status;
        poll `GET /admin/upgrade` for the rest.
      operationId: startRollback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
          description: The rollback has begun.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Go back to the version before the last upgrade
      tags:
        - admin
      x-kipp-package: api
  /admin/users:
    get:
      description: For an admin; a token may read it. The changes are made in a browser.
      operationId: listUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
          description: The users by name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Every user
      tags:
        - admin
      x-kipp-package: api
  /admin/users/{name}:
    get:
      description: For an admin; a token may read it.
      operationId: getUser
      parameters:
        - description: The user's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: The user.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: One user
      tags:
        - admin
      x-kipp-package: api
  /agent/claim:
    get:
      description: |
        A long-poll: it answers as soon as there is a stage for the agent, or a
        build ended, or when the server's wait is over with neither.
      operationId: agentClaim
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
          description: An assignment, or none, and the builds that ended since the last answer.
        "400":
          $ref: "#/components/responses/AgentRefusal"
        "401":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent asks for a stage to run
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/connect:
    post:
      description: |
        Sent when the agent starts and again every heartbeat. The server refuses
        an agent that is not its own version (409), and counts one offline after
        three missed. Every agent call carries the agent's token.
      operationId: agentConnect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponse"
          description: Who the server says the agent is.
        "400":
          $ref: "#/components/responses/AgentRefusal"
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "409":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent says who it is
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/stages/{id}/artifacts:
    put:
      description: |
        Once the stage's command has ended and before it is done. The body is a
        tar of the files; one the stage's files could not have made, or one over
        the stage's `max_size`, is refused.
      operationId: agentPutArtifacts
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - description: What the files come to, in bytes.
          in: query
          name: size
          schema:
            format: int64
            minimum: 0
            type: integer
      requestBody:
        content:
          application/x-tar:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: The files were kept.
        "400":
          $ref: "#/components/responses/AgentRefusal"
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "409":
          $ref: "#/components/responses/AgentRefusal"
        "410":
          $ref: "#/components/responses/AgentRefusal"
        "413":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent sends the files a stage keeps
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/stages/{id}/control:
    get:
      description: A long-poll. It answers `cancel` once the stage is to be killed, and `none` when the server's wait is over first.
      operationId: agentControl
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
          description: What to do.
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "410":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent asks whether to stop a stage
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/stages/{id}/done:
    post:
      description: The body is a tar of the stage's junit and metrics files.
      operationId: agentDone
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - description: The stage's exit code.
          in: query
          name: exit
          required: true
          schema:
            type: integer
        - description: How many times the agent ran the command; absent is once.
          in: query
          name: tries
          schema:
            minimum: 1
            type: integer
        - description: Why the stage could not run, when it could not.
          in: query
          name: error
          schema:
            type: string
      requestBody:
        content:
          application/x-tar:
            schema:
              format: binary
              type: string
      responses:
        "204":
          description: The stage is over.
        "400":
          $ref: "#/components/responses/AgentRefusal"
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "410":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent says a stage has ended
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/stages/{id}/inputs/{stage}:
    get:
      description: Only those of a stage the assignment is given the artifacts of; the agent puts them under the workspace before the command.
      operationId: agentGetInputs
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/StageName"
      responses:
        "200":
          content:
            application/x-tar:
              schema:
                format: binary
                type: string
          description: A tar of the files.
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "404":
          $ref: "#/components/responses/AgentRefusal"
        "410":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent fetches the files another stage kept
      tags:
        - internal
      x-kipp-package: agenthub
  /agent/stages/{id}/log:
    post:
      description: The body is the stage's output as a chunked stream, copied into its log as it arrives. Once per stage.
      operationId: agentSendLog
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: The output ended and was kept.
        "401":
          $ref: "#/components/responses/AgentRefusal"
        "409":
          $ref: "#/components/responses/AgentRefusal"
        "410":
          $ref: "#/components/responses/AgentRefusal"
      security:
        - agentToken: []
      summary: An agent sends a stage's output
      tags:
        - internal
      x-kipp-package: agenthub
  /builds/{id}:
    get:
      operationId: getBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - description: Set to `true` to hold the request until the build has ended, or the server's wait is over, and answer it as it is then. Only `true` and `false` are accepted.
          in: query
          name: wait
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
          description: The build.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: One build with its stages
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/again:
    post:
      description: |
        Needs the `build` permission on the job. Queues a build of the same job
        with the same params, as they were (a param the job no longer has is
        dropped, one it gained takes its default), and the same checkout where
        the original had one: a webhook build's commit, branch and default
        branch, a pull request's head and the base commit it was merged into.
        The new build's trigger is `api` and its `trigger_detail` is `again #`
        and the original's number. A build that has not ended, a job that is
        disabled or drops builds while one runs, and a server that is quiet
        refuse.
      operationId: buildAgain
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSummary"
          description: The new build, queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Build a finished build again
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageArtifactsList"
          description: The stages that kept files, each with its files and where to download them.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: What every stage of a build kept
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/cancel:
    post:
      description: Needs the `cancel` permission on the job.
      operationId: cancelBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
          description: The build is told to stop, and is as it is now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Cancel a build
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/keep:
    delete:
      description: |
        Needs the `build` permission on the job. The build is removed again by
        the rules that leave it alone while it is kept, as soon as one reaches it.
        Stopping what is not kept changes nothing. A build that has not ended is
        a conflict.
      operationId: unkeepBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
          description: The build, no longer kept.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Put a build back under the retention rules
      tags:
        - builds
      x-kipp-package: api
    put:
      description: |
        Needs the `build` permission on the job. The build is no longer removed
        by the job's `keep` rule, the rule for removed jobs or the artifacts cap,
        and does not count toward `keep.builds`. Keeping a build that is kept
        changes nothing: it stays kept by the first user. A build that has not
        ended is a conflict.
      operationId: keepBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
          description: The build, kept.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - bearerToken: []
        - csrfToken: []
          sessionCookie: []
      summary: Keep a finished build out of retention
      tags:
        - builds
      x-kipp-package: api
  /builds/{id}/metrics:
    get:
      operationId: getBuildMetrics
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildMetrics"
          description: The build's metrics by stage.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: What the stages of a build reported, and what the guards made of it
      tags:
        - builds
        - metrics
      x-kipp-package: api
  /builds/{id}/results:
