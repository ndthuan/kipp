          description: The GitHub App the job signs in as; null for a token.
          type:
            - string
            - "null"
        login:
          type: string
        old_hooks:
          description: Repos that carry a webhook kipp made and no longer keeps.
          items:
            type: string
          type: array
        overlaps:
          description: The repos this job shares with another job.
          items:
            $ref: "#/components/schemas/Overlap"
          type: array
        public_only:
          description: True when the last read could not list private repos.
          type: boolean
        repos:
          items:
            $ref: "#/components/schemas/Repo"
          type: array
        scan:
          oneOf:
            - $ref: "#/components/schemas/Scan"
            - type: "null"
      required:
        - login
        - app
        - scan
        - public_only
        - repos
        - old_hooks
        - overlaps
      type: object
    Param:
      additionalProperties: false
      description: A parameter a build of the job may be given.
      properties:
        default:
          type: string
        description:
          description: What the job's file says of it; null when it says nothing.
          type:
            - string
            - "null"
        name:
          type: string
        options:
          items:
            type: string
          type: array
        type:
          type: string
      required:
        - name
        - type
        - options
        - default
        - description
      type: object
    Problem:
      additionalProperties: false
      description: |
        What every 4xx and 5xx under `/api/v1` is, a problem document as RFC 9457
