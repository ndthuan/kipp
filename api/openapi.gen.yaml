          items:
            $ref: "#/components/schemas/AgentEnded"
          type:
            - array
            - "null"
      required:
        - Assignment
        - Ended
      type: object
    Concurrency:
      description: What the job does with a build triggered while another runs.
      enum:
        - queue
        - drop
        - parallel
        - supersede
      type: string
    ConnectRequest:
      description: |
        What an agent says of itself. It is sent when the agent starts and again
        every heartbeat as long as it runs; three missed and the server counts it
        offline. The field names are Go's.
      properties:
        Arch:
          type: string
        Fresh:
          description: True on the first connect of the agent's process.
          type: boolean
        OS:
          type: string
        Running:
          description: The assignments the agent is running now.
          items:
            type: string
          type:
            - array
            - "null"
        Version:
          description: The agent's kipp version. The server refuses any but its own with a 409.
          type: string
      type: object
    ConnectResponse:
      additionalProperties: false
      description: Who the server says the agent is. Labels and executors are the server's to set.
      properties:
        Executors:
          description: 0 for as many at once as it is given.
          type: integer
        Heartbeat:
          description: How often to connect again, in nanoseconds.
          format: int64
          type: integer
        Kill:
          description: Assignments the agent said it runs that the server does not know as running there.
          items:
            type: string
          type:
            - array
            - "null"
        Labels:
          items:
            type: string
          type:
            - array
            - "null"
        Name:
          type: string
        ServerVersion:
          type: string
      required:
        - Name
        - Labels
        - Executors
        - ServerVersion
        - Heartbeat
        - Kill
      type: object
    Control:
      additionalProperties: false
      properties:
        Action:
          enum:
            - none
            - cancel
          type: string
      required:
        - Action
      type: object
    Engine:
      additionalProperties: false
      description: A Docker engine, its record and what the server sees of it now.
      properties:
        enabled:
          type: boolean
        executors:
          description: How many stages it runs at once.
          type: integer
        kind:
          type: string
        labels:
          items:
            type: string
          type: array
        last_error:
          type: string
        name:
          type: string
        reachable:
          type: boolean
        running:
          description: The stages running on it, as `job#number/stage`.
          items:
            type: string
          type: array
        since:
          $ref: "#/components/schemas/NullableTimestamp"
        url:
          description: The engine's address with any password removed.
          type: string
        version:
          description: The Docker engine's version as it last answered a probe; empty before it has.
          type: string
      required:
        - name
        - kind
        - url
        - labels
        - executors
        - enabled
        - reachable
        - since
        - version
        - last_error
        - running
      type: object
    EngineList:
      additionalProperties: false
      description: |
        The rows of a list.
        `next_cursor` is the `cursor` that reads the page after this one, and null
        when this is the last (or the list is not paged).
      properties:
        items:
          items:
            $ref: "#/components/schemas/Engine"
          type: array
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
      required:
        - items
        - next_cursor
      type: object
    Guard:
      additionalProperties: false
      description: What a guard found of one item of a metric.
      properties:
        from:
          description: The build whose value the guard compared against; null when there was none.
          oneOf:
            - $ref: "#/components/schemas/BuildRef"
            - type: "null"
        item:
          type: string
        line:
          description: The guard's result as the stage's log has it.
          type: string
        metric:
          type: string
        outcome:
          description: How the guard ends the stage, `held` being not at all.
          enum:
            - held
            - failed
            - unstable
          type: string
        remembered:
          type:
            - number
            - "null"
        reported:
          type:
            - number
            - "null"
        tolerance:
          type: number
        verdict:
          enum:
            - held
            - no baseline
            - fell
            - missing
            - not reported
          type: string
      required:
        - metric
        - item
        - remembered
        - reported
        - tolerance
        - verdict
        - outcome
        - from
        - line
      type: object
    Health:
      additionalProperties: false
      properties:
        ok:
          const: true
        uptime_seconds:
          description: Whole seconds since the server started. Only a signed-in caller is told.
          type: integer
        version:
          description: The kipp version the server runs. Only a signed-in caller is told.
          type: string
      required:
        - ok
      type: object
    Job:
      additionalProperties: false
