components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A user's API token, made on the account page, or the `KIPP_TOKEN` a
        build is given (`kippb_...`). A build's token acts as no user and
        never as an admin: it holds the grants its job's `permissions:` name
        (by default `view` on the build's own job) and nothing else, on
        every route that takes a bearer token. It is 401 once the build has
        ended. It may start a build of a job it has `build` on, never of its
        own job: that is 403 `forbidden`, and the build it starts records
        `build <job>#<number>` as `started_by`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kipp_session
      description: |
        The browser session. A request that is not GET or HEAD must also
        carry the session's `X-CSRF-Token`, or it is 403.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The session's CSRF token, sent beside the session cookie on every request that changes something.
    runnerToken:
      type: http
      scheme: bearer
      description: A runner's token (`kippa_` followed by the secret).
    cacheToken:
      type: http
      scheme: bearer
      description: The token a build's stage is given to reach its caches, valid while the build runs.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: |
        `sha256=` and the hex HMAC-SHA256 of the request body, keyed with the
        secret of the job (or App) the delivery is for.
