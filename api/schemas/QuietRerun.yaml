type: object
additionalProperties: false
description: The running builds the restart is to stop and run again after the start.
required: [builds]
properties:
  builds:
    type: array
    minItems: 1
    items:
      $ref: BuildName.yaml
  restart:
    type: boolean
    description: |
      Restart the server now, once the builds are chosen. Refused (409),
      with nothing restarted, while any other build runs or waits.
