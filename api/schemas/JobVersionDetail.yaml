type: object
additionalProperties: false
description: One version with its YAML, null for a deletion.
required: [id, job, deleted, hash, author, how, at, yaml]
properties:
  id:
    type: integer
    format: int64
  job:
    type: string
  deleted:
    type: boolean
  hash:
    type: [string, "null"]
  author:
    type: string
  how:
    type: string
    enum: [api, web, mcp, import, seed, files, revert, resolve]
  at:
    $ref: Timestamp.yaml
  yaml:
    type: [string, "null"]
