type: object
additionalProperties: false
required: [set, missing, out_of_scope]
properties:
  set:
    type: array
    items:
      $ref: Secret.yaml
    description: Every secret that is set.
  missing:
    type: array
    items:
      $ref: Secret.yaml
    description: Every name a loaded job asks for that none holds.
  out_of_scope:
    type: array
    items:
      $ref: Secret.yaml
    description: Every secret that is set but whose scopes do not reach a loaded job that lists it, with those jobs in `jobs`. A build of such a job fails before it starts.
