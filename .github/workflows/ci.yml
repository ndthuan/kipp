name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-
      - run: make gogate
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
      - name: coverage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          go run ./internal/devtools/coverage report -profile coverage.out -o coverage.json
          base="$(gh run list --workflow ci --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$base" ]; then
            gh run download "$base" --name coverage --dir "$RUNNER_TEMP/base" || echo "run $base kept no coverage report"
          fi
          go run ./internal/devtools/coverage guard -base "$RUNNER_TEMP/base/coverage.json" -head coverage.json \
            -tolerance 0.1 -summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && !cancelled() && hashFiles('coverage.json') != ''
        with:
          name: coverage
          path: coverage.json
          retention-days: 90

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make js

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: dist
        run: |
          version="$(./scripts/version.sh)"
          make dist VERSION="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-binary:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux_amd64, os: ubuntu-latest}
          - {platform: linux_arm64, os: ubuntu-24.04-arm}
          - {platform: darwin_arm64, os: macos-latest}
          - {platform: darwin_amd64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.dist.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: smoke
        run: |
          dir="kipp_${VERSION#v}_${PLATFORM}"
          tar -xzf "dist/$dir.tar.gz" -C "$RUNNER_TEMP"
          ./scripts/smoke.sh bin "$RUNNER_TEMP/$dir/kipp" "$VERSION"

  smoke-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, os: ubuntu-latest}
          - {platform: linux/arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=ci-${{ github.sha }}
          tags: kipp:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: smoke
        run: ./scripts/smoke.sh image kipp:ci "ci-$GITHUB_SHA"

  latest:
    needs: [quality, js, dist, smoke-binary, smoke-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    env:
      VERSION: ${{ needs.dist.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: ./scripts/sign-release.sh sign dist
      - name: the release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          notes="kipp $VERSION, built from $GITHUB_SHA, the newest commit on main. It is not a release: kipp upgrade does not offer it."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --prerelease --title "kipp latest" --notes "$notes"
          fi
          gh release upload latest --clobber dist/*.tar.gz dist/SHA256SUMS.sig dist/SHA256SUMS
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            [ -e "dist/$name" ] || gh release delete-asset latest "$name" --yes
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit latest --prerelease --title "kipp latest" --notes "$notes"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ghcr.io/${{ github.repository }}:latest
          push: true
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
