name: ci

# Every push to main and every pull request: the gate on Linux and on
# macOS, then what a release would ship, built and started the way a user
# would. The archives are smoke-run each on a runner of its own platform,
# and the image on each of its two architectures (scripts/smoke.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the newest green run on main, for its coverage report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The gate checks scripts/ with shellcheck when it is there and says
      # NOT VERIFIED when it is not; the macOS image does not have it.
      - name: shellcheck
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      # golangci-lint keeps its analysis in a cache of its own, which
      # setup-go does not save; without it every run analyses from scratch.
      # The key moves with each commit and falls back to the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-
      - run: make quality
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
      # Coverage the way a kipp job keeps it: a metrics report (one item per
      # package and total), held to what main last had, as a guard with
      # no_lower does. The baseline is the report of the newest green run
      # on main; with none, it passes as no baseline. Linux alone: the two
      # systems run the same tests.
      - name: coverage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          go run ./internal/devtools/coverage report -profile coverage.out -o coverage.json
          base="$(gh run list --workflow ci --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$base" ]; then
            gh run download "$base" --name coverage --dir "$RUNNER_TEMP/base" || echo "run $base kept no coverage report"
          fi
          go run ./internal/devtools/coverage guard -base "$RUNNER_TEMP/base/coverage.json" -head coverage.json \
            -tolerance 0.1 -summary "$GITHUB_STEP_SUMMARY"
      # Kept when the guard fails too, to read what fell; only a green run's
      # report is ever a baseline.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && !cancelled() && hashFiles('coverage.json') != ''
        with:
          name: coverage
          path: coverage.json
          retention-days: 90

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: dist
        run: |
          version="$(git describe --tags --always --dirty)"
          make dist VERSION="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-binary:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux_amd64, os: ubuntu-latest}
          - {platform: linux_arm64, os: ubuntu-24.04-arm}
          - {platform: darwin_arm64, os: macos-latest}
          - {platform: darwin_amd64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.dist.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: smoke
        run: |
          dir="kipp_${VERSION#v}_${PLATFORM}"
          tar -xzf "dist/$dir.tar.gz" -C "$RUNNER_TEMP"
          ./scripts/smoke.sh bin "$RUNNER_TEMP/$dir/kipp" "$VERSION"

  smoke-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, os: ubuntu-latest}
          - {platform: linux/arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=ci-${{ github.sha }}
          tags: kipp:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: smoke
        run: ./scripts/smoke.sh image kipp:ci "ci-$GITHUB_SHA"
