name: release

# Publishing a GitHub release (which makes its tag) releases kipp: the
# gate, the archives smoke-run each on its own platform before anything is
# published, then the archives with their build provenance, the signed
# SHA256SUMS and the changelog's section as the notes, the container image on ghcr.io, and the
# Homebrew formula. What was published is installed and smoke-run again the
# way a user gets it. "Releasing" in AGENTS.md says what comes first.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Before anything else: the tag's name reaches shells and file names,
  # and a release is made from main alone.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, to find the tagged commit in it
      - name: a release tag
        run: ./scripts/check-version.sh --release "$TAG"
      - name: on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: notes
        run: ./scripts/release-notes.sh "$TAG" > /dev/null
      # The repository carries a placeholder public key until the real one
      # replaces it; nothing is built for a release signed by no one.
      - name: a real release key
        run: ./scripts/check-release-key.sh

  quality:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # golangci-lint keeps its analysis in a cache of its own, which
      # setup-go does not save; without it every run analyses from scratch.
      # The key moves with each commit and falls back to the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-
      - run: make quality
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

  dist:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make dist VERSION="$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  smoke-binary:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux_amd64, os: ubuntu-latest}
          - {platform: linux_arm64, os: ubuntu-24.04-arm}
          - {platform: darwin_arm64, os: macos-latest}
          - {platform: darwin_amd64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: smoke
        run: |
          dir="kipp_${TAG#v}_${PLATFORM}"
          tar -xzf "dist/$dir.tar.gz" -C "$RUNNER_TEMP"
          ./scripts/smoke.sh bin "$RUNNER_TEMP/$dir/kipp" "$TAG"

  # Each architecture's image is built natively and smoke-run before the
  # two are pushed together.
  smoke-image:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, os: ubuntu-latest}
          - {platform: linux/arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.TAG }}
          tags: kipp:release
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: smoke
        run: ./scripts/smoke.sh image kipp:release "$TAG"

  publish:
    needs: [smoke-binary, smoke-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the release's files and notes
      id-token: write # the signing certificate of the attestations
      attestations: write # the attestations themselves
      artifact-metadata: write # the attestations' storage records
      packages: write # the image on ghcr.io
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # GitHub makes an attestation for a public repository alone (or on an
      # Enterprise Cloud plan): a private copy releases without one.
      - name: no attestation in a private repository
        if: github.event.repository.private
        run: echo "::notice::a private repository, so the archives and the image are released without build provenance"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      # The key is in this step's environment alone. The signature is
      # verified against the public key in the repository before anything
      # is uploaded, so a secret that does not match it stops the release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: ./scripts/sign-release.sh sign dist
      - name: files and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --title "kipp $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # v1.2.3 is tagged 1.2.3, 1.2 and 1, and latest; a pre-release only
      # with its own version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          flavor: latest=auto
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # The formula in the tap is written from the published SHA256SUMS. The
  # tap is pushed to with a deploy key that may write to it and nothing
  # else (secret HOMEBREW_TAP_DEPLOY_KEY); a repository without the secret
  # releases everything else and writes no formula.
  homebrew:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      written: ${{ steps.formula.outputs.written }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: formula
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set: no formula written"
            exit 0
          fi
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:ndthuan/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          ./scripts/brew-formula.sh "$TAG" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Formula/kipp.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/kipp.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kipp $TAG"
          git push origin HEAD
          echo "written=true" >> "$GITHUB_OUTPUT"

  # The published files, downloaded the way a user gets them, against the
  # public key at the tagged commit.
  verify-signature:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sig --pattern "kipp_${TAG#v}_linux_amd64.tar.gz"
          ./scripts/sign-release.sh verify "$RUNNER_TEMP/published"

  # What a user gets, the way they get it.
  verify-homebrew:
    needs: homebrew
    if: ${{ needs.homebrew.outputs.written == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: brew install
        run: |
          brew install ndthuan/tap/kipp
          brew test kipp
          ./scripts/smoke.sh bin "$(brew --prefix)/bin/kipp" "$TAG"

  verify-image:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # a private repository's image; a public one is pulled as anyone pulls it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event.repository.private
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: docker pull
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          ./scripts/smoke.sh image "$IMAGE@$DIGEST" "$TAG"
